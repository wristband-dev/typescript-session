name: Test

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

jobs:
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x, 24.x]
    name: Use Node.js ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  test-deno:
    runs-on: ubuntu-latest
    name: Deno Latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Build with Node.js
        run: |
          npm ci
          npm run build
      - name: Test Deno compatibility
        run: |
          cat > deno_test.ts << 'EOF'
          // Test that Deno can import and use the Wristband Session SDK
          import { getSession } from "./dist/index.esm.js";
          
          console.log('✅ Deno successfully imported the Wristband Session SDK');
          
          // Test that we can use getSession with a mock request
          try {
            const mockRequest = new Request('https://example.com', {
              headers: { 'cookie': 'session=test' }
            });
            
            const session = await getSession(mockRequest, {
              secrets: 'test-secret-key-at-least-32-chars-long-for-security',
              cookieName: 'session',
              maxAge: 3600
            });
            
            if (!session) {
              throw new Error('getSession returned null/undefined');
            }
            
            // Test session operations
            session.userId = '123';
            
            const mockResponse = new Response('OK');
            const responseWithSession = await session.saveToResponse(mockResponse);
            
            const setCookieHeader = responseWithSession.headers.get('set-cookie');
            if (!setCookieHeader || !setCookieHeader.includes('session=')) {
              throw new Error('Session cookie not set in response');
            }
            
            console.log('✅ Wristband Session SDK works successfully in Deno');
            console.log(`   Session saved with userId: ${session.userId}`);
          } catch (error) {
            console.error('❌ SDK test failed:', error);
            Deno.exit(1);
          }
          EOF
          
          deno run --allow-net deno_test.ts
